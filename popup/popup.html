<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Page Summarizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="header-left">
        <div class="logo">✦</div>
        <h1 class="title">AI Summarizer</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
    </header>

    <div class="page-info">
      <span id="pageTitle" class="page-title">Loading...</span>
    </div>

    <div id="noKeyState" class="state hidden">
      <div class="state-icon">🔑</div>
      <p class="state-text">Add your Gemini API key to get started</p>
      <button id="goToSettingsBtn" class="btn btn-primary">Open Settings</button>
    </div>

    <div id="idleState" class="state hidden">
      <button id="summarizeBtn" class="btn btn-primary btn-large">
        <span class="btn-icon">✦</span>
        Summarize Page
      </button>
    </div>

    <div id="loadingState" class="state hidden">
      <div class="spinner"></div>
      <p class="loading-text">Analyzing page content...</p>
    </div>

    <div id="errorState" class="state hidden">
      <div class="state-icon">⚠</div>
      <p id="errorMessage" class="error-text"></p>
      <button id="retryBtn" class="btn btn-secondary">Try Again</button>
    </div>

    <div id="summaryState" class="state hidden">
      <div class="summary-meta">
        <span id="readingTime" class="meta-badge">⏱ Reading time</span>
        <span id="cacheIndicator" class="meta-badge cache hidden">⚡ Cached</span>
      </div>

      <section class="summary-section">
        <h2 class="section-title">Summary</h2>
        <ul id="summaryList" class="bullet-list"></ul>
      </section>

      <section class="summary-section">
        <h2 class="section-title">Key Insights</h2>
        <ul id="insightsList" class="bullet-list insights"></ul>
      </section>

      <div class="summary-actions">
        <button id="copyBtn" class="btn btn-secondary">Copy Summary</button>
        <button id="clearBtn" class="btn btn-ghost">Clear</button>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
